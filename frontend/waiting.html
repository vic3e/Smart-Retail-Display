<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lumen - Initializing...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: #090d16;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      user-select: none;
    }
    .spinner {
      width: 44px;
      height: 44px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 24px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      font-size: 26px;
      font-weight: 600;
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    p {
      font-size: 15px;
      color: #94a3b8;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Lumen Display</h1>
  <p id="status">Connecting to local signage service...</p>

  <script>
    async function checkBackend() {
      try {
        const res = await fetch("http://127.0.0.1:8000/api/media", { cache: "no-store" });
        if (res.ok) {
          document.getElementById("status").textContent = "Connected! Loading display...";
          window.location.replace("http://127.0.0.1:8000");
          return;
        }
      } catch (err) {
        // Backend still starting up
      }
      setTimeout(checkBackend, 1500);
    }
    checkBackend();
  </script>
</body>
</html>
